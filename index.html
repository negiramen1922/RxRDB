<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バベル Tier表メーカー｜リバリバ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d2346; --muted:#56719b; --line:rgba(13,35,70,.13); --line2:rgba(13,35,70,.22);
  --panel:rgba(255,255,255,.86); --panel2:rgba(236,246,255,.92); --field:rgba(255,255,255,.95);
  --accent:#1a86ff; --accent2:#19d3ff; --accent-ink:#0b4fb3; --soft:#dff1ff;
  --good:#0f9e63; --bad:#e23d63; --gold:#ffc93c;
  --a-break:#e9446c; --a-impact:#1a86ff; --a-blast:#f2831e;
  --sky:linear-gradient(180deg,#1b6fe0 0,#3fa3f5 260px,#9fd8ff 620px,#e3f4ff 1000px,#f3faff 100%);
  --clouds:radial-gradient(ellipse 420px 120px at 12% 520px,rgba(255,255,255,.75),transparent 70%),radial-gradient(ellipse 520px 140px at 85% 700px,rgba(255,255,255,.7),transparent 70%),radial-gradient(ellipse 360px 90px at 55% 980px,rgba(255,255,255,.65),transparent 70%);
  --shadow:0 10px 30px rgba(18,78,160,.14),0 1px 0 rgba(255,255,255,.8) inset;
  --display:"Oswald","Zen Kaku Gothic New",sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e6f0ff; --muted:#93acd3; --line:rgba(160,200,255,.14); --line2:rgba(160,200,255,.26);
  --panel:rgba(10,24,52,.84); --panel2:rgba(16,34,70,.9); --field:rgba(8,20,44,.95);
  --accent:#3b9bff; --accent2:#2fe0ff; --accent-ink:#9fd2ff; --soft:#16345f;
  --good:#3fdc93; --bad:#ff6b8d;
  --sky:linear-gradient(180deg,#030916 0,#0a1d42 420px,#0f2b5c 900px,#0b1a38 100%);
  --clouds:radial-gradient(1.5px 1.5px at 10% 120px,#fff,transparent),radial-gradient(1px 1px at 30% 300px,#cfe6ff,transparent),radial-gradient(1.5px 1.5px at 70% 200px,#fff,transparent),radial-gradient(1px 1px at 85% 420px,#cfe6ff,transparent),radial-gradient(1px 1px at 50% 560px,#fff,transparent),radial-gradient(ellipse 600px 160px at 80% 800px,rgba(60,140,255,.12),transparent 70%);
  --shadow:0 10px 30px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.06) inset;
}}
:root[data-theme="dark"]{
  --ink:#e6f0ff; --muted:#93acd3; --line:rgba(160,200,255,.14); --line2:rgba(160,200,255,.26);
  --panel:rgba(10,24,52,.84); --panel2:rgba(16,34,70,.9); --field:rgba(8,20,44,.95);
  --accent:#3b9bff; --accent2:#2fe0ff; --accent-ink:#9fd2ff; --soft:#16345f;
  --good:#3fdc93; --bad:#ff6b8d;
  --sky:linear-gradient(180deg,#030916 0,#0a1d42 420px,#0f2b5c 900px,#0b1a38 100%);
  --clouds:radial-gradient(1.5px 1.5px at 10% 120px,#fff,transparent),radial-gradient(1px 1px at 30% 300px,#cfe6ff,transparent),radial-gradient(1.5px 1.5px at 70% 200px,#fff,transparent),radial-gradient(ellipse 600px 160px at 80% 800px,rgba(60,140,255,.12),transparent 70%);
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--jp);font-size:15px;line-height:1.6;background:var(--clouds),var(--sky);background-color:#eef8ff;background-attachment:scroll;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.hidden,[hidden]{display:none!important}
.en{font-family:var(--display);letter-spacing:.06em}

/* ===== header / hero ===== */
header.top{position:relative;color:#fff}
.hero{position:relative;min-height:220px;background-color:#16233f;background-image:linear-gradient(100deg,rgba(5,16,42,.88) 0,rgba(10,30,72,.5) 40%,rgba(10,30,72,0) 70%),var(--hero,none);background-size:cover;background-position:center 45%;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(180deg,transparent,rgba(20,90,200,.6))}
.petals{position:absolute;inset:0;pointer-events:none;opacity:.85}
.brand{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:26px 20px 52px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.kicker{margin:0;font-family:var(--display);font-size:12px;letter-spacing:.32em;color:#bfe6ff}
.brand h1{margin:2px 0 0;font-family:var(--display);font-weight:700;font-size:clamp(48px,9vw,86px);line-height:.92;letter-spacing:.02em;transform:skewX(-10deg);transform-origin:left bottom;text-shadow:0 0 24px rgba(80,190,255,.65),0 3px 0 rgba(4,30,90,.5)}
.brand h1 span{display:inline-block;margin-left:.18em;color:transparent;-webkit-text-stroke:2px #fff;text-shadow:none}
.brand .sub{margin:8px 0 0;font-weight:700;font-size:15px;letter-spacing:.12em;text-shadow:0 1px 6px rgba(0,30,90,.6)}
.brand .acts{margin-left:auto;display:flex;gap:8px}
.tabs{position:relative;z-index:2;display:flex;gap:6px;max-width:1240px;margin:-34px auto 0;padding:0 20px;overflow-x:auto}
.tabs button{border:0;background:rgba(6,34,90,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#d7ecff;padding:9px 22px 8px;font-weight:700;white-space:nowrap;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);font-size:14px;letter-spacing:.06em}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,#fff,#e6f4ff);color:var(--accent-ink)}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{background:linear-gradient(180deg,#1d3d72,#14305e);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{background:linear-gradient(180deg,#1d3d72,#14305e);color:#fff}}
main{max-width:1240px;margin:0 auto;padding:22px 20px 40px}

/* ===== controls ===== */
.btn{border:1px solid var(--line2);background:var(--field);padding:7px 16px;font-size:14px;font-weight:700;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);color:var(--accent-ink)}
.btn:hover{background:var(--soft)}
.btn.primary{border:0;background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff;text-shadow:0 1px 2px rgba(0,40,120,.4)}
.btn.ghost-dark{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.55);color:#fff;backdrop-filter:blur(4px)}
.btn.ghost-dark:hover{background:rgba(255,255,255,.28)}
.btn.small{padding:4px 12px;font-size:13px}
.seg{display:inline-flex;gap:3px}
.seg button{border:1px solid var(--line2);background:var(--field);padding:5px 14px;font-size:13.5px;font-weight:700;color:var(--muted);clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.seg button[aria-pressed="true"]{background:linear-gradient(100deg,#0d3b8c,#1a86ff);border-color:transparent;color:#fff}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--field);border-radius:3px;padding:2px 10px;font-size:13px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--field);border-color:var(--ink)}
.search{border:0;border-bottom:2px solid var(--line2);background:var(--field);padding:6px 10px;min-width:0;flex:1 1 150px;border-radius:2px}
.search:focus{outline:none;border-bottom-color:var(--accent)}
.attr{display:inline-block;padding:0 8px;font-size:12px;font-weight:700;color:#fff;line-height:1.7;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.attr.破壊{background:var(--a-break)} .attr.衝撃{background:var(--a-impact)} .attr.爆発{background:var(--a-blast)}

/* ===== panels ===== */
.floorcard,.board,.pool,.tscroll,.empty{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.65);box-shadow:var(--shadow);border-radius:3px;position:relative}
:root[data-theme="dark"] .floorcard,:root[data-theme="dark"] .board,:root[data-theme="dark"] .pool,:root[data-theme="dark"] .tscroll{border-color:var(--line2)}
.floorcard::before,.board::before,.pool::before,.empty::before{content:"";position:absolute;left:-1px;top:-1px;width:120px;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2),transparent)}
.toolbar{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar h2,.ttl{margin:0 10px 0 0;font-weight:900;font-size:24px;line-height:1.1;display:inline-flex;flex-direction:column;transform:skewX(-8deg);color:var(--ink)}
.toolbar h2 small,.ttl small{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.3em;color:var(--accent)}
.count{color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:13px;margin:10px 0 0}

/* ===== tier view ===== */
.tierwrap{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:start}
.tower{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:3px}
.tower .seg{width:100%;display:flex;flex-direction:column;margin-bottom:12px;gap:4px}
.tower .seg button{text-align:left;font-size:12.5px;padding:5px 10px}
.tower .spire{width:2px;height:28px;background:linear-gradient(180deg,transparent,var(--accent2));margin-bottom:2px;box-shadow:0 0 12px var(--accent2)}
.floorbtn{border:0;background:var(--panel);backdrop-filter:blur(8px);padding:5px 10px;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px;position:relative;font-size:13px;line-height:1.35;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);box-shadow:var(--shadow)}
.floorbtn:hover{background:var(--soft)}
.floorbtn b{font-family:var(--display);font-weight:600;font-size:17px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.floorbtn small{position:absolute;right:7px;top:1px;font-size:9.5px!important}
.floorbtn span.boss{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.floorbtn i{width:7px;height:7px;transform:rotate(45deg);flex:0 0 auto;background:var(--line2)}
.floorbtn i.破壊{background:var(--a-break)} .floorbtn i.衝撃{background:var(--a-impact)} .floorbtn i.爆発{background:var(--a-blast)}
.floorbtn small{font-family:var(--display);color:var(--muted);font-size:11px}
.floorbtn[aria-current="true"]{background:linear-gradient(100deg,#0d3b8c,var(--accent) 70%,var(--accent2));color:#fff}
.floorbtn[aria-current="true"] b,.floorbtn[aria-current="true"] span.boss,.floorbtn[aria-current="true"] small{color:#fff}
.tierwrap>*{min-width:0}
.floors{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%}
.tower .base{width:100%;height:6px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin-top:4px}

.floorcard{padding:18px 20px;margin-bottom:16px}
.floorcard .head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.floorcard .num{font-family:var(--display);font-weight:700;font-size:58px;line-height:.85;transform:skewX(-10deg);background:linear-gradient(180deg,var(--accent2),var(--accent) 60%,#0d3b8c);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-flex;flex-direction:column}
.floorcard .num small{font-size:12px;letter-spacing:.35em;font-weight:600;-webkit-text-fill-color:var(--muted)}
.floorcard h2{font-weight:900;font-size:26px;margin:0 0 4px;line-height:1.2;transform:skewX(-6deg)}
.floorcard .type{color:var(--muted);font-size:13px;margin-bottom:6px}
.fgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.effects{margin:0;padding:0;list-style:none;font-size:14px}
.effects li{padding:2px 0 2px 1.4em;position:relative}
.effects li::before{content:"";position:absolute;left:.35em;top:.75em;width:5px;height:5px;transform:rotate(45deg);background:var(--line2)}
.effects li.sec{padding-left:0;margin-top:8px;font-weight:700;color:var(--accent-ink);font-size:12px;letter-spacing:.1em}
.effects li.sec::before{content:none}
.effects li.pos::before{content:"▲";background:none;transform:none;width:auto;height:auto;top:4px;left:.1em;color:var(--good);font-size:10px}
.effects li.neg::before{content:"▼";background:none;transform:none;width:auto;height:auto;top:4px;left:.1em;color:var(--bad);font-size:10px}
.note-h{font-size:11.5px;font-weight:700;color:var(--accent-ink);letter-spacing:.12em;margin:0 0 3px;display:flex;align-items:center;gap:6px}
.note-h::before{content:"";width:10px;height:2px;background:var(--accent)}
.note-b{white-space:pre-wrap;margin:0 0 12px;font-size:14px}
.recs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.recs button{border:1px solid rgba(255,190,40,.6);background:linear-gradient(100deg,rgba(255,214,90,.25),rgba(255,255,255,.4));padding:2px 12px;font-size:13px;font-weight:700;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
textarea.memo{width:100%;min-height:44px;border:1px dashed var(--line2);background:var(--field);border-radius:2px;padding:8px 10px;resize:vertical}

.board{overflow:hidden}
.trow{display:grid;grid-template-columns:76px 1fr;border-top:1px solid var(--line);min-height:68px}
.trow:first-child{border-top:0}
.tlabel{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:30px;color:#fff;border:0;text-shadow:0 2px 0 rgba(0,0,0,.25),0 0 12px rgba(255,255,255,.4);clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);font-style:italic;letter-spacing:.02em}
.zone{display:flex;flex-wrap:wrap;gap:6px;padding:9px 10px;align-content:flex-start}
.zone.armed{background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(26,134,255,.09) 9px 11px);cursor:copy}
.zone.over{background:rgba(26,134,255,.12)}
.tile{display:inline-flex;align-items:center;gap:7px;max-width:17em;background:var(--field);border:1px solid var(--line);border-left:4px solid var(--gc,var(--line2));padding:3px 10px 3px 3px;font-size:13.5px;font-weight:700;user-select:none;-webkit-user-select:none;touch-action:manipulation;text-align:left;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);box-shadow:0 2px 6px rgba(18,78,160,.08)}
.tile:hover{border-color:var(--accent)}
.tile img{width:32px;height:32px;object-fit:cover;flex:0 0 auto}
.tile .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .rl{font-size:10.5px;color:var(--muted);flex:0 0 auto}
.tile .ft{font-family:var(--display);font-size:12px;font-weight:600;flex:0 0 auto}
.tile .ft.p{color:var(--good)} .tile .ft.n{color:var(--bad)}
.tile .rec{color:#e6a800;font-size:12px}
.tile[aria-pressed="true"]{outline:2px solid var(--accent2);outline-offset:-2px;background:var(--soft);box-shadow:0 0 0 3px rgba(25,211,255,.25),0 0 18px rgba(25,211,255,.35)}
.tile.dragging{opacity:.4}
.pool{margin-top:16px}
.poolhead{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line)}
.poolhead h3{margin:0;font-size:15px;font-weight:900;transform:skewX(-6deg)}

.actionbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(100deg,rgba(6,30,86,.95),rgba(14,70,170,.95));color:#fff;padding:10px 18px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 20px);box-shadow:0 10px 30px rgba(4,20,60,.4),0 0 0 1px rgba(120,200,255,.35) inset;z-index:20;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.actionbar b{margin-right:6px;max-width:10em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actionbar .tb{border:0;padding:5px 13px;font-family:var(--display);font-weight:700;font-style:italic;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}

.empty{padding:30px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-weight:900;margin:0 0 6px;transform:skewX(-6deg)}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* ===== tables ===== */
.tscroll{overflow:auto;max-height:75vh}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
td.wrap{white-space:normal;min-width:16em;max-width:28em}
th{background:linear-gradient(180deg,#123f8f,#0d2f6e);color:#e6f3ff;position:sticky;top:0;font-weight:700;cursor:pointer;user-select:none;z-index:1;font-size:12.5px;letter-spacing:.04em}
tbody tr{cursor:pointer}
tbody tr:nth-child(even){background:rgba(26,134,255,.035)}
tbody tr:hover{background:rgba(26,134,255,.1)}
td.first,th.first{position:sticky;left:0;z-index:1}
td.first{background:var(--panel2)}
th.first{z-index:2}
.badge{display:inline-block;min-width:2.4em;text-align:center;font-family:var(--display);font-weight:700;font-style:italic;color:#fff;padding:0 8px;font-size:13px;text-shadow:0 1px 0 rgba(0,0,0,.3);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.dash{color:var(--line2)}

/* ===== dialogs ===== */
dialog{border:0;padding:0;background:var(--panel2);backdrop-filter:blur(14px);color:var(--ink);width:min(780px,calc(100% - 24px));max-height:calc(100% - 40px);box-shadow:0 20px 60px rgba(4,20,60,.45),0 0 0 1px rgba(120,200,255,.35);border-radius:3px}
dialog::backdrop{background:radial-gradient(ellipse at 50% 30%,rgba(30,110,220,.35),rgba(3,12,32,.7))}
.dlg{padding:22px}
.dlg h2{margin:0 0 8px;font-weight:900;font-size:26px;transform:skewX(-6deg)}
.dlg h3{font-size:13px;margin:20px 0 8px;padding:3px 12px;color:#fff;background:linear-gradient(100deg,#0d3b8c,var(--accent) 60%,transparent);letter-spacing:.12em;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dlg label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
.dlg textarea{width:100%;min-height:150px;border:1px solid var(--line2);background:var(--field);border-radius:2px;padding:8px;font-size:13px}
.dlg select,.dlg input[type=number]{border:1px solid var(--line2);background:var(--field);padding:6px}
.err{color:var(--bad);font-size:13px}
.metarow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.metarow span.m{border:1px solid var(--line2);background:var(--field);padding:1px 9px;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.stats div{background:var(--field);border-left:3px solid var(--accent);padding:5px 10px}
.stats small{display:block;color:var(--muted);font-size:11px}
.stats b{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.02em}
.lv{display:grid;grid-template-columns:4.6em 1fr;gap:5px 12px;font-size:14px;margin:0}
.lv dt{color:var(--accent-ink);font-family:var(--display);font-size:12.5px;padding-top:2px;font-weight:600}
.lv dd{margin:0}
.sname{font-weight:900;font-size:16px;margin-bottom:4px}
.sname small{font-weight:400;color:var(--muted);margin-left:8px;font-size:12.5px}
.floortiers{display:flex;gap:6px;flex-wrap:wrap}
.floortiers div{border:1px solid var(--line2);background:var(--field);padding:2px 9px;font-size:12.5px;font-family:var(--display)}
.preview{margin-top:10px;font-size:13px}
.ic{width:18px;height:18px;vertical-align:-4px;object-fit:contain;flex:0 0 auto}
.ic.ord{background:#0f2e63;padding:1px}
.ic.big{width:26px;height:26px}
.tile .ic{width:17px;height:17px}
.banner{width:calc(100% + 44px);margin:-22px -22px 16px;display:block;aspect-ratio:720/300;object-fit:cover;object-position:center 30%;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}

function condHit(cond,c){const k=ALIAS[cond]||cond;if(k==="女性")return c.gender==="女";if(k==="男性")return c.gender==="男";return [c.attr,c.order,c.rank,c.style,c.base].includes(k);}
function scMatch(s,c){const n=s.conds.filter(x=>condHit(x,c)).length;return{n,roleOk:!s.role||s.role===c.role||s.role==="ワイルド"};}
const RAR={SSR:3,SR:2,R:1};
function colOf(d,names){for(const n of names){const i=d.headers.indexOf(n);if(i>=0)return i;}return -1;}
function buildModels(){
  const d=data("chars");
  const iId=Math.max(0,colOf(d,["ID","キャラID"])>=0?colOf(d,["ID","キャラID"]):colOf(d,["キャラ名","名前"]));
  const iNm=colOf(d,["キャラ名","名前"]);
  const g=n=>colOf(d,[n]);
  const ix={attr:g("属性"),role:g("ロール"),rank:g("階級"),order:g("騎士団"),style:g("スタイル"),base:g("キャラ"),date:g("実装日"),dtype:g("ダメージタイプ"),gender:g("性別")};
  CH=[];CHMAP={};
  d.rows.forEach((r,i)=>{
    const id=(r[iId]||"").trim();if(!id||CHMAP[id])return;
    const v=k=>ix[k]>=0?(r[ix[k]]||"").trim():"";
    const c={id,name:(iNm>=0&&r[iNm]?r[iNm]:id).trim(),row:r,i,attr:v("attr"),role:v("role"),rank:v("rank"),order:v("order"),style:v("style"),base:v("base"),dtype:v("dtype"),gender:v("gender"),date:parseDate(v("date"))};
    CH.push(c);CHMAP[id]=c;
  });
  STYLES=[...new Set(CH.map(c=>c.style).filter(Boolean))];
  const sd=data("scripts");const si=n=>colOf(sd,[n]);
  const SI={name:si("名前"),role:si("ロール"),rar:si("レアリティ"),date:si("実装日"),c2:si("条件2"),c3:si("条件3")};
  SC=sd.rows.map((r,i)=>{const v=k=>SI[k]>=0?(r[SI[k]]||"").trim():"";return{i,row:r,name:v("name")||r[0],role:v("role"),rar:v("rar"),date:parseDate(v("date")),conds:[v("c2"),v("c3")].filter(Boolean)};});
  const b=data("babel");const bi=n=>colOf(b,[n]);
  const B={type:bi("バベル種類"),floor:bi("階層"),boss:bi("ボス"),attr:bi("推奨属性"),eff:bi("解析データ"),point:bi("ポイント"),rec:bi("おすすめキャラID"),comment:bi("コメント")};
  FLOORS=[];TYPES=[];
  b.rows.forEach(r=>{
    const v=k=>B[k]>=0?(r[B[k]]||"").trim():"";
    const type=v("type")||"バベル",fl=v("floor");if(!fl)return;
    if(!TYPES.includes(type))TYPES.push(type);
    const recs=v("rec").split(/[,、，\s]+/).map(x=>x.replace(/＿/g,"_").replace(/_デフォルト$/,"_DEFAULT").trim()).filter(Boolean);
    const f={key:type+"|"+fl,type,floor:fl,boss:v("boss"),attr:v("attr"),eff:v("eff"),point:v("point"),recs,comment:v("comment")};
    f.lines=analyzeEffects(f.eff);
    FLOORS.push(f);
  });
  if(!TYPES.includes(S.curType))S.curType=TYPES[0]||null;
  const inType=FLOORS.filter(f=>f.type===S.curType);
  if(!inType.find(f=>f.key===S.curFloor))S.curFloor=inType.length?inType[inType.length-1].key:null;
}
function parseDate(s){const m=String(s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);return m?+m[1]*10000+ +m[2]*100+ +m[3]:0;}

/* ---------- effect analysis ---------- */
function analyzeEffects(text){
  let sec="";
  return String(text||"").split(/\n/).map(s=>s.trim()).filter(Boolean).map(line=>{
    const m=line.match(/^【(.+)】$/);
    if(m){sec=m[1];return{text:line,sec:true};}
    return Object.assign({text:line},judge(line,sec));
  });
}
function judge(line,sec){
  if(sec==="敵"){
    const m=line.match(/(破壊|衝撃|爆発)属性から受けるダメージが減少/);
    return m?{pol:-1,targets:[["attr",m[1]]]}:{};
  }
  if(sec&&sec!=="味方")return{};
  if(/敵に対する/.test(line))return{};
  let pol=0;
  if(/鈍化無効/.test(line))pol=1;
  else if(/鈍化が付与/.test(line))pol=-1;
  else if(/コストが低下/.test(line))pol=1;
  else if(/(HP|攻撃力)が上昇|短縮|回復量が(増加|上昇)/.test(line))pol=1;
  else if(/(HP|攻撃力)が低下|延長/.test(line))pol=-1;
  if(!pol)return{};
  const t=[];
  if(/全騎士/.test(line))t.push(["all",""]);
  ATTRS.forEach(a=>{if(line.includes(a+"属性"))t.push(["attr",a]);});
  ROLES.forEach(a=>{if(line.includes(a))t.push(["role",a]);});
  RANKS.forEach(a=>{if(new RegExp("(^|[^A-Z])"+a+"([^A-Z]|$)").test(line))t.push(["rank",a]);});
  ORDERS.forEach(a=>{if(line.includes(a))t.push(["order",a]);});
  STYLES.forEach(a=>{if(a&&line.includes(a))t.push(["style",a]);});
  return t.length?{pol,targets:t}:{};
}
function hit(c,t){return t[0]==="all"||c[t[0]]===t[1];}
function fit(c,f){
  if(!f)return{score:0,reasons:[]};
  let score=0;const reasons=[];
  if(f.attr&&c.attr===f.attr){score+=1;reasons.push(["+","推奨属性（"+f.attr+"）"]);}
  f.lines.forEach(l=>{if(l.pol&&l.targets.some(t=>hit(c,t))){score+=l.pol;reasons.push([l.pol>0?"+":"−",l.text]);}});
  return{score,reasons};
}

function tile(c,f,fits){

function ptile(c){

function moveTo(id,tier){const P=place(S.curFloor);if(tier)P[id]=tier;else delete P[id];save();}
function bindDrag(){
  main.querySelectorAll(".tile").forEach(t=>{
    t.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",t.dataset.id);t.classList.add("dragging");});
    t.addEventListener("dragend",()=>t.classList.remove("dragging"));
  });

    z.addEventListener("dragover",e=>{e.preventDefault();z.classList.add("over");});
    z.addEventListener("dragleave",()=>z.classList.remove("over"));
    z.addEventListener("drop",e=>{e.preventDefault();const id=e.dataTransfer.getData("text/plain");if(id){moveTo(id,z.dataset.zone);sel=null;render();}});
  });
}

  const rows=CH.map(c=>{const ts=fl.map(f=>place(f.key)[c.id]);const v=ts.map(sc).filter(x=>x!=null);return{c,ts,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null,cnt:v.length};})
    .filter(r=>r.cnt).sort((a,b)=>b.avg-a.avg||b.cnt-a.cnt);

function renderBabel(){

/* ---------- ranking ---------- */
function sth(s){return SIMG[s.name]?`<img src="${SIMG[s.name]}" alt="" class="rowth">`:`<span class="rowth sph ${esc(s.rar)}" title="画像未登録">${esc((s.rar||"").slice(0,3))}</span>`;}
const RKDEF={chars:[["HP最大値","HP","desc"],["攻撃力最大値","攻撃力","desc"],["物理防御","物理防御","desc"],["特殊防御","特殊防御","desc"],["攻撃速度","攻撃速度","desc"],["抵抗値","抵抗値","desc"],["初期コスト","出撃コスト","asc"],["育成後コスト","育成後コスト","asc"],["再出撃時間(S)","再出撃時間","asc"],["スキルクールタイム","スキルCT","asc"],["BLADEゲージ","BLADEゲージ","asc"],["HP初期値","HP初期値","desc"],["攻撃力初期値","攻撃力初期値","desc"]],
  scripts:[["HP最大値","HP","desc"],["攻撃力最大値","攻撃力","desc"],["物理防御","物理防御","desc"],["特殊防御","特殊防御","desc"]]};
const RK={t:"chars",stat:"HP最大値",dir:"desc",attr:null,role:null,focus:null};
const SPEED={"S":5,"Aplus":4,"APlus":4,"A+":4,"A":3,"Bplus":2,"BPlus":2,"B+":2,"B":1,"C":0};
function rkVal(stat,v){if(stat==="攻撃速度"){const k=String(v||"").trim();return k in SPEED?SPEED[k]:null;}return num(v);}
function renderRank(){
  const isC=RK.t==="chars";const d=data(RK.t);const ci=d.headers.indexOf(RK.stat);
  const defs=RKDEF[RK.t].filter(x=>d.headers.includes(x[0]));

  if(RK.role)items=items.filter(o=>o.x.role===RK.role);
  items.sort((a,b)=>RK.dir==="desc"?b.v-a.v:a.v-b.v);
  const max=Math.max(...items.map(o=>o.v),0),min=Math.min(...items.map(o=>o.v),0);
  let prev=null,rank=0;items.forEach((o,i)=>{if(o.v!==prev){rank=i+1;prev=o.v;}o.rank=rank;});
  const roles=isC?ROLES:[...new Set(SC.map(s=>s.role).filter(Boolean))];
  const label=(defs.find(x=>x[0]===RK.stat)||[0,RK.stat])[1];
  let h=`<div class="toolbar"><h2><small>RANKING</small>ランキング</h2><div class="seg"><button data-rkt="chars" aria-pressed="${isC}">キャラ</button><button data-rkt="scripts" aria-pressed="${!isC}">スクリプト</button></div>
   <span class="count">${items.length} / ${total}件</span></div>
   <div class="rkbar"><div class="chips">${defs.map(x=>`<button class="chip" data-rkstat="${esc(x[0])}" aria-pressed="${x[0]===RK.stat}">${esc(x[1])}</button>`).join("")}</div>
   <button class="btn small" data-rkdir="1">${RK.dir==="desc"?"高い順 ▼":"低い順 ▲"}</button></div>

   <div class="chips">${roles.map(a=>`<button class="chip" data-rkrole="${esc(a)}" aria-pressed="${RK.role===a}">${ic(a)}${esc(a)}</button>`).join("")}</div></div>

  items.forEach(o=>{const x=o.x;const id=isC?x.id:String(x.i);const foc=RK.focus!=null&&String(RK.focus)===id;
    const pct=max===min?100:Math.max(4,(RK.dir==="desc"?(o.v-min)/(max-min):(max-o.v)/(max-min))*100);
    const th=isC?IMG[x.id]:null;
    h+=`<tr class="${foc?"rkrow-focus":""}" ${isC?`data-detail="${esc(x.id)}"`:`data-sdetail="${x.i}"`}><td class="rkn">${o.rank<=3?`<span class="medal m${o.rank}">${o.rank}</span>`:o.rank}</td>
    <td class="first">${isC?(th?`<img src="${th}" alt="" class="rowth">`:""):sth(x)}<b>${esc(x.name)}</b></td>
    <td>${isC?`${ic(x.attr)} <span class="attr ${esc(x.attr)}">${esc(x.attr)}</span>`:`<span class="rar ${esc(x.rar)}">${esc(x.rar)}</span>`}</td><td>${ic(x.role)} ${esc(x.role)}</td>
    <td><div class="rkval"><b>${esc(o.raw)}</b><span class="bar"><i style="width:${pct.toFixed(1)}%"></i></span></div></td></tr>`;});
  main.innerHTML=h+`</tbody></table></div><p class="hint">行をクリックで詳細。${isC?"属性・ロールで絞り込むと、その中での順位になります。":"属性で絞り込むと、その属性が条件に入っているスクリプトだけになります。"}同じ値は同じ順位です。</p>`;
  if(RK.focus!=null){const el=main.querySelector(".rkrow-focus");if(el)requestAnimationFrame(()=>el.scrollIntoView({block:"center"}));}
}

/* ---------- import ---------- */
function parseDelimited(text){
  text=text.replace(/^\uFEFF/,"");const first=text.split(/\r?\n/,1)[0]||"";const d=first.includes("\t")?"\t":",";
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"'&&f===""){q=true;}
    else if(c===d){row.push(f);f="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f="";}
    else f+=c;}
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}

  const P=place(f.key);let s=`【${f.type} ${f.floor}F ${f.boss}${f.attr?"／推奨"+f.attr:""}】\n`;
  let any=false;TIERS.forEach(t=>{const l=CH.filter(c=>P[c.id]===t).map(c=>c.name);if(l.length){any=true;s+=`${t}：${l.join(" / ")}\n`;}});
  if(S.notes[f.key])s+=`メモ：${S.notes[f.key]}\n`;
  return any||S.notes[f.key]?s:"";
}

/* ================= live data / media ================= */
let ADMIN=false,DB=null,ASSETSCAP=null,DLCAP=null,DBSTATE="local",MEDIA={},TBLMETA={};
const TABLES=["chars","scripts","babel"];
const TLABEL={chars:"キャラ",scripts:"スクリプト",babel:"バベル"};
const blob=id=>"/_blob/"+id;
function toast(msg,ms){const el=document.getElementById("toast");el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true;},ms||2600);}
function setHero(){document.getElementById("hero").style.setProperty("--hero",HERO?`url(${HERO})`:"none");}
function hashId(s){let h1=0x811c9dc5,h2=0x1234567;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=Math.imul(h2^c,2246822519)>>>0;}return h1.toString(36)+h2.toString(36);}
function applyMedia(){
  for(const k in IMG)delete IMG[k];Object.assign(IMG,BASE.IMG);
  for(const k in BANNER)delete BANNER[k];Object.assign(BANNER,BASE.BANNER);
  for(const k in ICON)delete ICON[k];Object.assign(ICON,BASE.ICON);
  for(const k in SIMG)delete SIMG[k];Object.assign(SIMG,BASE.SIMG);for(const k in SFULL)delete SFULL[k];Object.assign(SFULL,BASE.SFULL);
  HERO=BASE.HERO;
  Object.values(MEDIA).forEach(m=>{
    if(!m||!m.key)return;
    const full=m.full?blob(m.full):"",th=m.thumb?blob(m.thumb):full;
    if(m.kind==="char"){if(th)IMG[m.key]=th;if(full)BANNER[m.key]=full;}
    else if(m.kind==="script"){if(th)SIMG[m.key]=th;if(full)SFULL[m.key]=full;}
    else if(m.kind==="icon"){if(full)ICON[m.key]=full;}
    else if(m.kind==="hero"&&full)HERO=full;
  });
  setHero();
  applyCrops();
}
let rerenderT=null;
function rerender(){clearTimeout(rerenderT);rerenderT=setTimeout(()=>{buildModels();if(MODE==="admin"){if(!(ATAB==="edit"&&ED.dirty)&&!(ATAB==="io"&&IO.text))renderAdmin();}else render();},60);}
async function connect(){
  if(!window.claude||!window.claude.use)return;
  try{
    const user=await window.claude.use("user");
    ADMIN=user?await user.canEdit().catch(()=>false):false;
    document.getElementById("openAdmin").hidden=!ADMIN;
  }catch(e){}
  try{DB=await window.claude.use("db");}catch(e){DB=null;}
  if(ADMIN){try{ASSETSCAP=await window.claude.use("assets");}catch(e){}try{DLCAP=await window.claude.use("downloads");}catch(e){}}
  if(!DB){DBSTATE="local";return;}
  DBSTATE="loading";
  const parts={},metas={};
  const assemble=k=>{
    const m=metas[k];if(!m){if(LIVE[k]){delete LIVE[k];rerender();}return;}
    const ps=parts[k]||{};const rows=[];
    for(let i=0;i<m.parts;i++){const p=ps["p"+i];if(!p||p.rev!==m.rev)return;rows.push(...(p.rows||[]).map(r=>Array.isArray(r)?r.map(x=>x==null?"":String(x)):[]));}
    LIVE[k]={headers:(m.headers||[]).slice(),rows};TBLMETA[k]=m;rerender();
  };
  TABLES.forEach(k=>{
    DB.doc("tables/"+k).onSnapshot(s=>{metas[k]=s.exists?s.data():null;if(!s.exists)delete TBLMETA[k];assemble(k);},e=>{});
    DB.collection("tables/"+k+"/parts").onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=d.data();});parts[k]=o;assemble(k);},e=>{});
  });
  DB.collection("crops").onSnapshot(q=>{CROPS={};q.docs.forEach(d=>{CROPS[d.id]=d.data();});applyCrops();},e=>{});
  DB.collection("media").onSnapshot(q=>{MEDIA={};q.docs.forEach(d=>{MEDIA[d.id]=d.data();});applyMedia();rerender();},e=>{});
  DBSTATE="live";
}
/* write a whole table: parts first (new rev), then meta, then drop extra parts */
async function saveTable(k,headers,rows){
  if(!DB)throw {message:"データベースに接続できません"};
  const rev=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const chunks=[];let cur=[],size=0;
  rows.forEach(r=>{const s=JSON.stringify(r).length;if(cur.length&&(size+s>180000||cur.length>=60)){chunks.push(cur);cur=[];size=0;}cur.push(r.map(x=>String(x??"")));size+=s;});
  if(cur.length||!chunks.length)chunks.push(cur);
  const old=TBLMETA[k]?TBLMETA[k].parts||0:0;
  for(let i=0;i<chunks.length;i++)await DB.doc(`tables/${k}/parts/p${i}`).set({rev,rows:chunks[i]});
  await DB.doc("tables/"+k).set({headers:headers.slice(),parts:chunks.length,rev,updatedAt:new Date().toISOString(),count:rows.length});
  for(let i=chunks.length;i<old;i++){try{await DB.doc(`tables/${k}/parts/p${i}`).delete();}catch(e){}}
  LIVE[k]={headers:headers.slice(),rows:rows.map(r=>r.map(x=>String(x??"")))};
}
function dbErr(e){const c=e&&e.code;if(c==="invalid_argument")return "保存できませんでした（編集権限がないか、データが大きすぎます）";if(c==="quota_exceeded")return "データベースの容量がいっぱいです";if(c==="resource_exhausted")return "書き込みが混み合っています。少し待ってからもう一度保存してください";return "保存できませんでした："+(e&&e.message||c||"不明なエラー");}

async function edAction(a){
  const d=data(ED.k);
  if(a==="new"){ED.sel=d.rows.length;ED.draft=d.headers.map(()=>"");ED.dirty=true;ED.confirmDel=false;renderEdit();return;}
  if(a==="cancel"){if(ED.sel>=d.rows.length){ED.sel=-1;ED.draft=null;}else ED.draft=d.rows[ED.sel].slice();ED.dirty=false;ED.confirmDel=false;renderEdit();return;}
  if(a==="del"){ED.confirmDel=true;renderEdit();return;}
  if(a==="delno"){ED.confirmDel=false;renderEdit();return;}
  if(a==="addcol"){const n=(ED.newCol||"").trim();if(!n)return toast("列名を入力してください");if(d.headers.includes(n))return toast("同じ名前の列があります");

    const rows=d.rows.map(r=>r.slice());

  }
}

/* ================= import / export ================= */
const IO={k:"chars",text:"",hr:-1,mode:"merge",preview:null,confirmReset:false};
function rowKey(k,hd,r,seen){
  const g=n=>{const i=hd.indexOf(n);return i>=0?(r[i]||"").trim():"";};
  let key=k==="chars"?(g("ID")||g("キャラ名")):k==="babel"?g("バベル種類")+"|"+g("階層"):g("名前");
  if(seen){seen[key]=(seen[key]||0)+1;if(seen[key]>1)key+="#"+seen[key];}
  return key;
}
function diffTables(k,cur,inc){
  const map=(d)=>{const s={},m=new Map();d.rows.forEach(r=>{const key=rowKey(k,d.headers,r,s);if(key)m.set(key,r);});return m;};
  const A=map(cur),B=map(inc);const added=[],changed=[],removed=[];
  const val=(d,r,h)=>{const i=d.headers.indexOf(h);return i>=0?(r[i]||"").trim():"";};
  B.forEach((r,key)=>{if(!A.has(key))added.push(key);else{const a=A.get(key);const diffs=inc.headers.filter(h=>val(cur,a,h)!==val(inc,r,h));if(diffs.length)changed.push([key,diffs]);}});
  A.forEach((r,key)=>{if(!B.has(key))removed.push(key);});
  return{added,changed,removed,A,B};
}
function mergeTables(k,cur,inc,replace){

  if(replace)return{headers:inc.headers.slice(),rows:inc.rows.map(r=>inc.headers.map((_,i)=>r[i]||""))};
  const sI={},incMap=new Map();inc.rows.forEach(r=>incMap.set(rowKey(k,inc.headers,r,sI),r));
  const sC={},used=new Set();
  const rows=cur.rows.map(r=>{const key=rowKey(k,cur.headers,r,sC);const base=conv(cur,r);if(incMap.has(key)){used.add(key);const n=incMap.get(key);inc.headers.forEach((h,i)=>{base[hd.indexOf(h)]=n[i]||"";});}return base;});

function toTSV(d){const q=v=>/[\t\n"]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;return [d.headers,...d.rows].map(r=>r.map(x=>q(String(x||""))).join("\t")).join("\n");}
function toCSV(d){const q=v=>/[,\n"]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;return "﻿"+[d.headers,...d.rows].map(r=>r.map(x=>q(String(x||""))).join(",")).join("\r\n");}

const READ=[["一番","いちばん"],["可愛","かわい"],["全て","すべて"],["出来","でき"],["下さい","ください"],["貴方","あなた"],["僕","ぼく"],["私","わたし"],["御用心","ごようじん"],["ご用心","ごようじん"],["綺譚","奇譚"],["見て","みて"]];
const ROMAN={"iii":"3","ii":"2","iv":"4","vi":"6","v":"5","i":"1"};
function norm(s){
  s=String(s||"").normalize("NFKC").toLowerCase().replace(/\.(png|jpe?g|webp|gif|bmp|avif)$/,"").replace(/defalut|defualt/g,"default");
  for(const [k,v] of READ)s=s.split(k).join(v);
  s=s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  s=s.replace(/(^|[^a-z])(iii|ii|iv|vi|v|i)$/,(m,a,b)=>a+ROMAN[b]);
  s=s.replace(/[ーｰ―‐\-–—]/g,"").replace(/[^\p{L}\p{N}]/gu,"");
  return s;
}
function bigrams(s){const m=new Map();for(let i=0;i<s.length-1;i++){const b=s.slice(i,i+2);m.set(b,(m.get(b)||0)+1);}return m;}
function sim(a,b){
  if(!a||!b)return 0;if(a===b)return 1;
  const na=(a.match(/\d+$/)||[""])[0],nb=(b.match(/\d+$/)||[""])[0];
  let s;
  const sa=a.length<b.length?a:b,lb=a.length<b.length?b:a;
  if(sa.length>=4&&lb.includes(sa))s=0.75+0.2*sa.length/lb.length;
  else{const A=bigrams(a),B=bigrams(b);let inter=0;A.forEach((v,k)=>{if(B.has(k))inter+=Math.min(v,B.get(k));});s=(2*inter)/Math.max(1,(a.length-1)+(b.length-1));}
  if(na!==nb){s*=(na&&nb)?0.35:0.8;}
  return Math.min(s,0.99);
}
function scoreFile(name,tg){const n=norm(name);let best=0;tg.alts.forEach(a=>{best=Math.max(best,sim(n,norm(a)));});return best;}

function canvasBlob(im,sx,sy,sw,sh,dw,dh,type,q){const c=document.createElement("canvas");c.width=Math.round(dw);c.height=Math.round(dh);const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>{if(b&&b.type===type)r(b);else c.toBlob(r,"image/png");},type,q));}
async function processImage(file,kind){
  const im=await loadImg(file);const W=im.naturalWidth,H=im.naturalHeight;
  const fit=(mw)=>{const s=Math.min(1,mw/W);return[W*s,H*s];};
  if(kind==="icon"){const s=Math.min(1,96/Math.max(W,H));return{full:await canvasBlob(im,0,0,W,H,W*s,H*s,"image/png")};}
  if(kind==="hero"){const[dw,dh]=fit(1800);return{full:await canvasBlob(im,0,0,W,H,dw,dh,"image/webp",.8)};}
  const[dw,dh]=fit(kind==="char"?960:900);
  const full=await canvasBlob(im,0,0,W,H,dw,dh,"image/webp",.8);
  let side,sx,sy;
  if(W>H*1.2){side=H*0.46;sx=W/2-side/2;sy=H*0.08;}else{side=Math.min(W,H)*0.9;sx=(W-side)/2;sy=Math.min(H-side,H*0.04);}
  const thumb=await canvasBlob(im,sx,sy,side,side,128,128,"image/webp",.8);
  return{full,thumb};
}
async function imAction(a,btn){
  if(a==="clear"){IM.files.forEach(f=>URL.revokeObjectURL(f.url));IM.files=[];renderImg();return;}
  if(a==="upload"){
    if(!ASSETSCAP||!DB)return toast("この画面では画像を登録できません");
    IM.busy=true;const todo=IM.files.filter(f=>f.on&&f.key&&f.status!=="done");let ok=0;
    for(const f of todo){f.status="up";renderImg();
      try{const p=await processImage(f.file,IM.k);
        const up=async b=>{try{return await ASSETSCAP.upload(b);}catch(e){if(e&&e.code==="store_unavailable")return await ASSETSCAP.upload(b);throw e;}};
        const full=await up(p.full);const thumb=p.thumb?await up(p.thumb):null;
        const id="m_"+IM.k+"_"+hashId(f.key);
        await DB.doc("media/"+id).set({kind:IM.k,key:f.key,full:full.id,thumb:thumb?thumb.id:null,file:f.name,at:new Date().toISOString()});
        f.status="done";f.on=false;ok++;}
      catch(e){f.status="err";f.err=e&&(e.code||e.message);}
    }
    IM.busy=false;renderImg();toast(`${ok}件の画像を登録しました${ok<todo.length?`（${todo.length-ok}件は失敗）`:""}`,4000);return;
  }
}
async function imDel(id){if(!DB)return;try{await DB.doc("media/"+id).delete();toast("画像を外しました");}catch(e){toast(dbErr(e));}}

AM.addEventListener("click",e=>{
  const t=e.target.closest("[data-edk],[data-edrow],[data-ed],[data-iok],[data-io],[data-imk],[data-im],[data-imdel],[data-crop]");if(!t)return;const ds=t.dataset;
  if(ds.edk){if(ED.dirty&&!ED.leaveOk){ED.leaveOk=true;toast("保存していない変更があります。もう一度押すと破棄して切り替えます",3500);return;}ED.leaveOk=false;ED.k=ds.edk;ED.sel=-1;ED.draft=null;ED.dirty=false;ED.q="";renderEdit();return;}
  if(ds.edrow!==undefined){if(ED.dirty&&!ED.leaveOk&&+ds.edrow!==ED.sel){ED.leaveOk=true;toast("保存していない変更があります。もう一度押すと破棄して切り替えます",3500);return;}ED.leaveOk=false;ED.sel=+ds.edrow;ED.draft=data(ED.k).rows[ED.sel].slice();ED.dirty=false;ED.confirmDel=false;renderEdit();
    if(window.innerWidth<820){const f=document.getElementById("edform");if(f)f.scrollIntoView({block:"start"});}return;}
  if(ds.ed){edAction(ds.ed);return;}
  if(ds.iok){IO.k=ds.iok;IO.confirmReset=false;renderIO();return;}
  if(ds.io){ioAction(ds.io,t);return;}
  if(ds.imk){IM.k=ds.imk;IM.files.forEach(f=>URL.revokeObjectURL(f.url));IM.files=[];renderImg();return;}
  if(ds.im){imAction(ds.im,t);return;}
  if(ds.imdel){imDel(ds.imdel);return;}
  if(ds.crop!==undefined){openCrop(IM.k,ds.crop);return;}
});

/* ================= thumbnail crops ================= */
let CROPS={};const CROPURL={};
function cropSrc(kind,key){return kind==="char"?BANNER[key]:SFULL[key];}
function loadImgSrc(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
async function cropBlob(src,c,size){const im=await loadImgSrc(src);const W=im.naturalWidth,H=im.naturalHeight;const side=c.cs*H;return canvasBlob(im,c.cx*W,c.cy*H,side,side,size,size,"image/webp",.85);}
let cropRun=0;
function cropSig(src,c){return [src.length,src.slice(-48),c.cx,c.cy,c.cs].join("|");}
async function applyCrops(){
  const run=++cropRun;const todo=[];
  Object.values(CROPS).forEach(c=>{if(!c||!c.key)return;const src=cropSrc(c.kind,c.key);if(!src)return;const k=c.kind+"|"+c.key;
    if(CROPURL[k]&&CROPURL[k].sig===cropSig(src,c))(c.kind==="char"?IMG:SIMG)[c.key]=CROPURL[k].url;else todo.push([c,src,k]);});
  let changed=false;
  for(const [c,src,k] of todo){try{const b=await cropBlob(src,c,128);if(run!==cropRun)return;if(CROPURL[k])URL.revokeObjectURL(CROPURL[k].url);CROPURL[k]={sig:cropSig(src,c),url:URL.createObjectURL(b)};(c.kind==="char"?IMG:SIMG)[c.key]=CROPURL[k].url;changed=true;}catch(e){}}
  if(changed)rerender();
}
function autoCrop(W,H){if(W>H*1.2){const cs=.46;return{cs,cx:Math.max(0,.5-cs*H/W/2),cy:.08};}const s=Math.min(W,H)*.9;return{cs:s/H,cx:(W-s)/2/W,cy:Math.min(H-s,H*.04)/H};}
const CR={kind:"",key:"",c:null,W:0,H:0,drag:null};
function openCrop(kind,key){
  const src=cropSrc(kind,key);if(!src){toast("元の画像がないため調整できません");return;}
  const id="c_"+kind+"_"+hashId(key);const cur=CROPS[id];
  const label=kind==="char"?(CHMAP[key]?CHMAP[key].name:key):key;
  CR.kind=kind;CR.key=key;CR.id=id;CR.c=null;
  document.getElementById("cropBody").innerHTML=`<h2>${esc(label)}</h2><p class="hint" style="margin:0 0 10px">四角をドラッグして顔の位置に合わせ、スライダーで大きさを変えてください。</p>
  <div class="cropwrap" id="cropWrap"><img id="cropImg" src="${src}" alt="" draggable="false"><div id="cropBox"></div></div>
  <div class="croprow"><label class="inl" for="cropSize">大きさ</label><input type="range" id="cropSize" min="12" max="100" step="1"><canvas id="cropPrev" width="96" height="96"></canvas></div>
  <div class="foot">${cur?`<button class="btn" id="cropReset">自動の位置に戻す</button>`:""}<span style="flex:1"></span><button class="btn" data-close>キャンセル</button><button class="btn primary" id="cropSave">保存</button></div>`;
  const dl=document.getElementById("dlgCrop");if(!dl.open)dl.showModal();
  const img=document.getElementById("cropImg"),box=document.getElementById("cropBox"),sz=document.getElementById("cropSize");
  const draw=()=>{if(!CR.c)return;const s=img.clientWidth/CR.W;box.style.left=CR.c.cx*CR.W*s+"px";box.style.top=CR.c.cy*CR.H*s+"px";box.style.width=box.style.height=CR.c.cs*CR.H*s+"px";
    const cv=document.getElementById("cropPrev");const x=cv.getContext("2d");x.clearRect(0,0,96,96);const side=CR.c.cs*CR.H;x.drawImage(img,CR.c.cx*CR.W,CR.c.cy*CR.H,side,side,0,0,96,96);};
  const clamp=()=>{const c=CR.c;const maxS=Math.min(1,CR.W/CR.H);c.cs=Math.min(Math.max(c.cs,.08),maxS);c.cx=Math.min(Math.max(c.cx,0),1-c.cs*CR.H/CR.W);c.cy=Math.min(Math.max(c.cy,0),1-c.cs);};
  const init=()=>{CR.W=img.naturalWidth;CR.H=img.naturalHeight;CR.c=cur?{cx:cur.cx,cy:cur.cy,cs:cur.cs}:autoCrop(CR.W,CR.H);clamp();sz.value=Math.round(CR.c.cs/Math.min(1,CR.W/CR.H)*100);draw();};
  if(img.complete&&img.naturalWidth)init();else img.onload=init;
  const toImg=e=>{const r=img.getBoundingClientRect();return[(e.clientX-r.left)/r.width*CR.W,(e.clientY-r.top)/r.height*CR.H];};
  const wrap=document.getElementById("cropWrap");
  wrap.addEventListener("pointerdown",e=>{if(!CR.c)return;e.preventDefault();const[px,py]=toImg(e);const c=CR.c;const side=c.cs*CR.H;
    const inside=px>=c.cx*CR.W&&px<=c.cx*CR.W+side&&py>=c.cy*CR.H&&py<=c.cy*CR.H+side;
    if(!inside){c.cx=(px-side/2)/CR.W;c.cy=(py-side/2)/CR.H;clamp();draw();}
    CR.drag={px,py,cx:c.cx,cy:c.cy};wrap.setPointerCapture(e.pointerId);});
  wrap.addEventListener("pointermove",e=>{if(!CR.drag)return;const[px,py]=toImg(e);CR.c.cx=CR.drag.cx+(px-CR.drag.px)/CR.W;CR.c.cy=CR.drag.cy+(py-CR.drag.py)/CR.H;clamp();draw();});
  wrap.addEventListener("pointerup",()=>{CR.drag=null;});wrap.addEventListener("pointercancel",()=>{CR.drag=null;});
  sz.addEventListener("input",()=>{const c=CR.c;if(!c)return;const midx=c.cx*CR.W+c.cs*CR.H/2,midy=c.cy*CR.H+c.cs*CR.H/2;c.cs=sz.value/100*Math.min(1,CR.W/CR.H);c.cx=(midx-c.cs*CR.H/2)/CR.W;c.cy=(midy-c.cs*CR.H/2)/CR.H;clamp();draw();});
  window.addEventListener("resize",draw);
  document.getElementById("cropSave").addEventListener("click",async e=>{if(!DB||!CR.c)return;e.target.disabled=true;
    try{await DB.doc("crops/"+CR.id).set({kind:CR.kind,key:CR.key,cx:+CR.c.cx.toFixed(4),cy:+CR.c.cy.toFixed(4),cs:+CR.c.cs.toFixed(4),at:new Date().toISOString()});dl.close();toast("サムネイルの位置を保存しました");}
    catch(er){e.target.disabled=false;toast(dbErr(er));}});
  const rs=document.getElementById("cropReset");if(rs)rs.addEventListener("click",async()=>{try{await DB.doc("crops/"+CR.id).delete();dl.close();toast("自動の位置に戻しました");}catch(er){toast(dbErr(er));}});
}

/* ================= static site export ================= */
function dataBlob(src){const i=src.indexOf(",");const mime=src.slice(5,i).split(";")[0];const bin=atob(src.slice(i+1));const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:mime});}
async function exportSite(btn){
  if(!window.JSZip){toast("ZIPを作る部品を読み込めませんでした。ページを開き直してください",5000);return;}
  if(!DLCAP){toast("この画面ではファイルを保存できません");return;}
  btn.disabled=true;const label=btn.textContent;let n=0,fail=0;
  try{
    const zip=new JSZip();const map=new Map();
    const EXT={"image/webp":"webp","image/png":"png","image/jpeg":"jpg","image/gif":"gif","image/svg+xml":"svg","image/avif":"avif"};
    const put=async(src,pre)=>{if(!src)return "";if(map.has(src))return map.get(src);let b;
      try{if(src.startsWith("data:"))b=dataBlob(src);else{const r=await fetch(src);if(!r.ok)throw 0;b=await r.blob();}}catch(e){fail++;return "";}
      const p=`img/${pre}${(n++).toString(36)}.${EXT[b.type]||"png"}`;zip.file(p,b);map.set(src,p);if(n%25===0)btn.textContent=`画像をまとめています… ${n}`;return p;};
    const out={thumbs:{},banners:{},icons:{},sthumbs:{},sfull:{},hero:""};
    const each=async(obj,dst,pre)=>{for(const [k,v] of Object.entries(obj)){const p=await put(v,pre);if(p)dst[k]=p;}};
    await each(IMG,out.thumbs,"t");await each(BANNER,out.banners,"b");await each(ICON,out.icons,"i");await each(SIMG,out.sthumbs,"s");await each(SFULL,out.sfull,"f");
    out.hero=await put(HERO,"h");
    const seed={chars:data("chars"),scripts:data("scripts"),babel:data("babel")};
    const doc=new DOMParser().parseFromString(PRISTINE,"text/html");
    doc.querySelectorAll("script").forEach(s=>{const keep=s.id==="seed"||s.id==="assets"||s.id==="app"||/jszip/.test(s.getAttribute("src")||"");if(!keep)s.remove();});
    const J=o=>JSON.stringify(o).replace(/<\//g,"<\\/");
    doc.getElementById("seed").textContent=J(seed);doc.getElementById("assets").textContent=J(out);
    zip.file("index.html","<!DOCTYPE html>\n"+doc.documentElement.outerHTML);
    btn.textContent="ZIPを作っています…";
    const blob=await zip.generateAsync({type:"blob"});
    await DLCAP.save({filename:"babel-tier-site.zip",data:blob});
    toast(`公開用ZIPを書き出しました（画像${n}点${fail?`、読み込めなかった画像${fail}点`:""}）`,5000);
  }catch(e){if(!(e&&e.code==="declined"))toast("書き出しに失敗しました："+(e&&(e.message||e.code)||""),5000);}
  btn.disabled=false;btn.textContent=label;
}

/* ================= static site mode (GitHub Pages) ================= */
let SITE_LOADED=!window.SITE;
async function loadSite(){
  if(!window.SITE)return;
  const get=p=>fetch(p,{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(p);return r.json();});
  const [c,s,b,im]=await Promise.all(["data/chars.json","data/scripts.json","data/babel.json","data/images.json"].map(p=>get(p).catch(()=>null)));
  if(c)LIVE.chars=c;if(s)LIVE.scripts=s;if(b)LIVE.babel=b;
  if(im){Object.assign(BASE.IMG,im.thumbs||{});Object.assign(BASE.BANNER,im.banners||{});Object.assign(BASE.ICON,im.icons||{});Object.assign(BASE.SIMG,im.sthumbs||{});Object.assign(BASE.SFULL,im.sfull||{});if(im.hero)BASE.HERO=im.hero;}
  SITE_LOADED=true;applyMedia();buildModels();render();
  if(!c||!b)main.insertAdjacentHTML("afterbegin",'<div class="astatus warn">データの読み込みに失敗しました。ページを再読み込みしてください。</div>');
}
function loadAnalytics(){
  const c=window.SITE||{};
  if(c.cfBeacon){const s=document.createElement("script");s.defer=true;s.src="https://static.cloudflareinsights.com/beacon.min.js";s.setAttribute("data-cf-beacon",JSON.stringify({token:c.cfBeacon}));document.head.appendChild(s);}
  if(c.ga){const s=document.createElement("script");s.async=true;s.src="https://www.googletagmanager.com/gtag/js?id="+c.ga;document.head.appendChild(s);window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments);};gtag("js",new Date());gtag("config",c.ga);}
}
function track(name,params){try{if(window.gtag)gtag("event",name,params||{});}catch(e){}}
setHero();
buildModels();render();connect();loadSite();loadAnalytics();
})();
